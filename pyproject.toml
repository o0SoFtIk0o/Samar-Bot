[project]
name = "samar-hub-news-bot"
version = "0.1.0"
description = "Telegram moderation + source parser system for Samar Hub"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.4.1,<4.0.0",
  "telethon>=1.36.0,<2.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "pydantic>=2.6.0,<3.0.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
